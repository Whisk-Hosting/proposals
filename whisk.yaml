whisk: 1
name: proposals

customer_identity: none

routes:
  # Clients never sign in: each proposal is open at its own unguessable /p/ link. Everything
  # else is for a signed-in person from the business's team. /api/v1 checks its own keys.
  public: ["/health", "/assets/**", "/p/**", "/api/**"]
  # Accepting, declining and asking a question need the bot challenge solved first.
  challenge: ["/p/**"]

health:
  path: /health
  timeout: 60

database: app
migrate: "node dist/migrate.js"

# Logos and section images are uploaded to storage.
storage: true
# Proposal, acceptance and follow-up emails, from the business's own domain once it is verified.
email: true

functions:
  - name: send-email
    event: email.send
    graph: workflows/send-email.graph.yaml
  - name: deliver-webhook
    event: webhook.deliver
    graph: workflows/deliver-webhook.graph.yaml

env:
  LOG_LEVEL: info
  # "1" only on the live demo (demo/whisk.yaml): see src/demo.ts.
  DEMO: "0"
